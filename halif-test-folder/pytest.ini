[pytest]
testpaths = tests
pythonpath = .
norecursedirs = third_party .venv artifacts logs
addopts = -ra
markers =
    feature(name): functional feature grouping for each API testcase
    raft: integration test requiring a configured and reachable DUT
    component(name): registered HAL component identity
    L1: Level 1 HAL test cases
    L2: Level 2 HAL test cases
    L3: Level 3 HAL test cases
    profile(section, groups, inputs, expected, id_labels): numbered profile parameters
    hal_case(api, case_type, case_id): exact HAL case selection metadata

